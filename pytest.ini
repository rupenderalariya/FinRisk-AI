[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# -q keeps output readable; strict markers catch typos in marker names.
addopts =
    -q
    --strict-markers
    --tb=short

markers =
    integration: exercises the real dataset end to end (skipped when the file is absent)
    slow: takes more than a second or so

filterwarnings =
    error::FutureWarning
    error::DeprecationWarning
    ignore::DeprecationWarning:streamlit.*
    ignore::DeprecationWarning:plotly.*
